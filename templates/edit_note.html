{% extends "base.html" %}

{% block title %}
Editar nota
{% endblock title %}

{% block content %}
<div class="max-w-md mx-auto mt-12 bg-white shadow-lg rounded-lg p-6">

    <h1 class="text-2xl font-semibold text-gray-800 mb-6 text-center">
        Editar nota
    </h1>

    <form method="POST" class="space-y-4">

        <div>
            <label for="title" class="block text-black font-medium mb-1">
                Título
            </label>
            <input
                type="text"
                name="title"
                id="title"
                value="{{ note.title }}"
                required
                class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring focus:ring-gray-400"
            >
        </div>

        <div>
            <label for="content" class="block text-black font-medium mb-1">
                Contenido
            </label>
            <input
                type="text"
                name="content"
                id="content"
                value="{{ note.content }}"
                required
                class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring focus:ring-gray-400"
            >
        </div>

        <div class="flex justify-end space-x-2">
            <a
                href="{{ url_for('notes.home') }}"
                class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-100 transition"
            >
                Cancelar
            </a>

            <button
                type="submit"
                class="bg-gray-800 text-white px-5 py-2 rounded-md hover:bg-gray-700 transition"
            >
                Guardar cambios
            </button>
        </div>

    </form>
</div>
{% endblock content %}
