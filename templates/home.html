<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina de Inicio</title>
</head>
<body>
    <h1>Bienvenido a Flask notes</h1>

    {% if role == "admin" %}
        <button>Eliminar</button>
    {% else %}
        <button>Solicitar Eliminación</button>
    {% endif %}

    <ul>
    {% for note in notes %}
        <li>{{ note }}</li>
    {% endfor %}
    </ul>

</body>
</html>
